name: job_platform_mobile
description: "Vietnam Job Platform - Flutter mobile app for job seekers and recruiters"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  file_picker: ^11.0.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# flutter_native_splash configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.jpg
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.jpg
