name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Enforce >= 70% line coverage gate (MAINT-02)
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info was not generated"
            exit 1
          fi
          awk -F: '
            /^LF:/ { lf += $2 }
            /^LH:/ { lh += $2 }
            END {
              if (lf == 0) {
                print "::error::No instrumented lines found in coverage/lcov.info"
                exit 1
              }
              pct = (lh / lf) * 100.0
              printf("Line coverage: %d / %d (%.2f%%)\n", lh, lf, pct)
              if (pct < 70.0) {
                printf("::error::Line coverage %.2f%% is below required 70.0%% (MAINT-02)\n", pct)
                exit 1
              }
            }
          ' coverage/lcov.info
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  # A release APK must actually build with an explicit gateway URL. The debug
  # build (and the test suite) never exercise `kReleaseMode`, so without this job
  # a store build missing `--dart-define=FLUTTER_API_URL=...` ships unnoticed.
  #
  # release packaging refuses to run without a keystore (android/app/build.gradle.kts),
  # so this CI-only build signs with a throwaway key generated in the job. It is
  # never published and the debug key is not used for a release artifact.
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create a throwaway CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci-release \
            -storepass ci-release-password \
            -keypass ci-release-password \
            -dname "CN=CI Release, OU=CI, O=PBL6, L=Ho Chi Minh, ST=HCMC, C=VN"
      - name: Build release APK (exercises the release configuration)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
          ANDROID_KEYSTORE_PASSWORD: ci-release-password
          ANDROID_KEY_ALIAS: ci-release
          ANDROID_KEY_PASSWORD: ci-release-password
        run: >
          flutter build apk --release
          --obfuscate
          --split-debug-info=build/symbols
          --dart-define=FLUTTER_API_URL=https://example.invalid
          --dart-define=ENABLE_MOCKS=false

  release-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS release without codesign (iOS 16+ compile verification)
        run: >
          flutter build ios --release --no-codesign
          --obfuscate
          --split-debug-info=build/ios-symbols
          --dart-define=FLUTTER_API_URL=https://example.invalid
          --dart-define=ENABLE_MOCKS=false
